<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" id="introSvg">
<style>
  #introSvg #introBar { stroke-dasharray: 100 200; stroke-dashoffset: 101;
    animation: introBarDraw .35s ease-out .15s both,
               introSlide .6s cubic-bezier(.55,.1,.35,1) .55s both,
               introFeed 1.4s cubic-bezier(.5,.05,.3,1) 1.15s forwards,
               introBarTuck .28s ease-out 2.55s forwards; }
  @keyframes introBarDraw { to { stroke-dashoffset: 0 } }
  @keyframes introSlide { from { transform: translateX(200px) } to { transform: translateX(0) } }
  @keyframes introFeed { to { stroke-dashoffset: 88.5 } }
  @keyframes introBarTuck { from { stroke-dashoffset: 88.5 } to { stroke-dashoffset: 100 } }
  #introSvg #introArc1 { stroke-dasharray: 100 200; stroke-dashoffset: 101; animation: introArc1Draw 1.4s cubic-bezier(.5,.05,.3,1) 1.15s both; }
  @keyframes introArc1Draw { to { stroke-dashoffset: 0 } }
  #introSvg #introArc2 { stroke-dasharray: 100 200; stroke-dashoffset: 101; animation: introArc2Draw .28s ease-out 2.55s both; }
  @keyframes introArc2Draw { to { stroke-dashoffset: 0 } }
  #introSvg #introTag { opacity: 0; letter-spacing: 6px; animation: introTag .6s ease-out 2.9s both; }
  @keyframes introTag { to { opacity: 1; letter-spacing: 2px } }
  #introSvg #introGlow { opacity: 0; animation: introGlowIn .5s ease-out 2.9s both, introGlowPulse 2.4s ease-in-out 3.3s infinite; }
  @keyframes introGlowIn { to { opacity: .28 } }
  @keyframes introGlowPulse { 0%,100% { opacity: .28 } 50% { opacity: .5 } }
  #introSvg #introPulse { transform-box: fill-box; transform-origin: center;
    animation: introSettle .4s cubic-bezier(.3,1.8,.4,1) 2.8s both, introPulse 2.6s ease-in-out 3.3s infinite; }
  @keyframes introSettle { from { transform: scale(1.035) } to { transform: scale(1) } }
  @keyframes introPulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.022) } }
  @media (prefers-reduced-motion: reduce) {
    #introSvg #introBar, #introSvg #introArc1, #introSvg #introArc2, #introSvg #introTag,
    #introSvg #introGlow, #introSvg #introPulse { animation: none !important }
    #introSvg #introBar { stroke-dashoffset: 100; opacity: 0 }
    #introSvg #introArc1, #introSvg #introArc2 { stroke-dashoffset: 0 }
    #introSvg #introTag { opacity: 1; letter-spacing: 2px }
    #introSvg #introGlow { opacity: .28 }
  }
</style>
